{% extends "base.html" %}

{% block title %}Sign In — RevTrack{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;">
    <div class="card" style="width: 100%; max-width: 440px; padding: 2.5rem; border-color: rgba(99, 102, 241, 0.25); box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-icon" style="width: 54px; height: 54px; margin: 0 auto 1rem auto; font-size: 1.5rem;">
                <i class="fa-solid fa-chart-line-up"></i>
            </div>
            <h2 style="font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px;">Welcome Back</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">Sign in to your RevTrack financial dashboard</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label for="login_email"><i class="fa-regular fa-envelope"></i> Email Address</label>
                <input type="email" id="login_email" name="email" placeholder="name@company.com" required autofocus>
            </div>

            <div class="form-group">
                <label for="login_password"><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" id="login_password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Dashboard
            </button>
        </form>

        <div class="form-divider" style="margin: 1.75rem 0;">
            <span>Or Quick Demo</span>
        </div>

        <!-- 1-Click Demo Login Button -->
        <form action="{{ url_for('demo_login') }}" method="POST">
            <button type="submit" class="btn btn-outline" style="width: 100%; border-color: var(--success); color: var(--success); padding: 0.7rem;">
                <i class="fa-solid fa-bolt-lightning"></i> 1-Click Demo (Pre-loaded Family & Data)
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.75rem; font-size: 0.85rem; color: var(--text-secondary);">
            Don't have an account? 
            <a href="{{ url_for('register') }}" style="font-weight: 600; color: var(--primary);">Create an Account</a>
        </div>
    </div>
</div>
{% endblock %}
